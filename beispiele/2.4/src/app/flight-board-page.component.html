<div class="page-content">
  <div class="page-head">
    <div>
      <h2 class="page-title">{{ pageTitle }}</h2>
      @if (lastUpdated) {
        <p class="page-meta">Zuletzt geladen: {{ lastUpdated }} Uhr</p>
      }
    </div>
    <div class="head-actions">
      <button class="btn-neutral" type="button" (click)="refresh()">
        &#8635; Aktualisieren
      </button>
      <button class="btn-primary" type="button" (click)="showForm = !showForm">
        {{ showForm ? 'Schlie&szlig;en' : '+ Flug hinzuf&uuml;gen' }}
      </button>
    </div>
  </div>

  @if (showForm) {
    <app-add-flight-form
      (add)="createFlight($event)"
      (cancel)="showForm = false"
    />
  }

  <app-filter-bar
    [searchQuery]="searchQuery"
    [statusFilter]="statusFilter"
    (searchQueryChange)="updateSearch($event)"
    (statusFilterChange)="updateStatusFilter($event)"
    (reset)="resetFilters()"
  />

  @if (errorMessage) {
    <div class="error-block">
      <p>{{ errorMessage }}</p>
    </div>
  }

  @if (isLoading && !errorMessage) {
    <div class="board-loading">
      <div class="loading-spinner"></div>
      <p>Flüge werden geladen ...</p>
    </div>
  } @else {
    <app-flight-table
      [title]="pageTitle"
      [flights]="flights"
      (remove)="deleteFlight($event)"
      (statusChange)="changeStatus($event.id, $event.status)"
    />
  }
</div>
