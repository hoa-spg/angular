<form class="add-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <h3>Neuen Flug hinzuf&uuml;gen</h3>

  <div class="add-form-grid">
    <div class="form-field">
      <label class="form-label" for="flightNumber">Flugnummer *</label>
      <input
        id="flightNumber"
        class="form-input"
        [class.form-input--error]="showError('flightNumber')"
        formControlName="flightNumber"
        placeholder="z.B. OS123"
      >
      @if (showError('flightNumber')) {
        <span class="form-error">{{ getError('flightNumber') }}</span>
      }
    </div>

    <div class="form-field">
      <label class="form-label" for="airline">Airline *</label>
      <input
        id="airline"
        class="form-input"
        [class.form-input--error]="showError('airline')"
        formControlName="airline"
        placeholder="z.B. Austrian Airlines"
      >
      @if (showError('airline')) {
        <span class="form-error">{{ getError('airline') }}</span>
      }
    </div>

    <div class="form-field">
      <label class="form-label" for="type">Typ *</label>
      <select id="type" class="form-select" formControlName="type">
        <option value="departure">↑ Abflug</option>
        <option value="arrival">↓ Ankunft</option>
      </select>
    </div>

    <div class="form-field">
      <label class="form-label" for="scheduledTime">Planzeit *</label>
      <input
        id="scheduledTime"
        type="time"
        class="form-input"
        [class.form-input--error]="showError('scheduledTime')"
        formControlName="scheduledTime"
      >
      @if (showError('scheduledTime')) {
        <span class="form-error">{{ getError('scheduledTime') }}</span>
      }
    </div>

    <div class="form-field">
      <label class="form-label" for="airport">Airport *</label>
      <input
        id="airport"
        class="form-input"
        [class.form-input--error]="showError('airport')"
        formControlName="airport"
        placeholder="z.B. Frankfurt (FRA)"
      >
      @if (showError('airport')) {
        <span class="form-error">{{ getError('airport') }}</span>
      }
    </div>

    <div class="form-field">
      <label class="form-label" for="terminal">Terminal *</label>
      <select id="terminal" class="form-select" formControlName="terminal">
        <option value="T1">T1</option>
        <option value="T2">T2</option>
        <option value="T3">T3</option>
      </select>
    </div>

    <div class="form-field">
      <label class="form-label" for="expectedTime">Erw. Zeit (optional)</label>
      <input id="expectedTime" type="time" class="form-input" formControlName="expectedTime">
    </div>

    <div class="form-field">
      <label class="form-label" for="gate">Gate (optional)</label>
      <input id="gate" class="form-input" formControlName="gate" placeholder="z.B. B12">
    </div>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn-success">Speichern</button>
    <button type="button" (click)="cancel.emit()">Abbrechen</button>
  </div>
</form>
