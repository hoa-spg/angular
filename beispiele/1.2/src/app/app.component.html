<app-airport-header airportName="Wien-Schwechat (VIE)" />

<div class="page-content">
  <div class="page-head">
    <div>
      <h1 class="page-title">FlugBoard</h1>
      <p class="page-meta">Lektion 1.2 &middot; @Input, @Output, Komponentenkomposition</p>
    </div>
  </div>

  @if (selectedFlight) {
    <div class="selected-info">
      <strong>Ausgew&auml;hlt:</strong>
      {{ selectedFlight.flightNumber }} &ndash; {{ selectedFlight.airline }}
      ({{ selectedFlight.airport }})
    </div>
  }

  <div class="card-grid">
    @for (flight of flights; track flight.id) {
      <app-flight-card
        [flight]="flight"
        (select)="onFlightSelect($event)"
      />
    }
  </div>
</div>
